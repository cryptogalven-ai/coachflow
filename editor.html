<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Éditeur visuel CoachFlow</title><style>:root{--g:#0f8f68;--d:#09271f;--bg:#f4f7f5;--line:#dfe8e3}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#0b1f18}.app{max-width:980px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:14px}.hero{background:var(--d);color:#fff}.hero h1{margin:0 0 6px}.hero p{margin:0;color:#c9d8d2}.label{font-size:12px;font-weight:900;margin:0 0 8px}.terrainChoice{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.terrainChoice button,.tool,.small{border:1px solid var(--line);border-radius:14px;padding:11px;font-weight:800;background:#fff}.terrainChoice button.sel{background:#e6f7ef;border-color:var(--g);color:#087454}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.tool{background:#e6f7ef}.danger{background:#fff0ef;color:#9b2c24}.editor{height:min(70vh,650px);min-height:430px;background:#16805a;border-radius:20px;position:relative;overflow:hidden;touch-action:pan-y}.field{position:absolute;inset:18px;border:3px solid white;border-radius:12px;pointer-events:none}.mid,.circle,.box{position:absolute;pointer-events:none}.mid{left:50%;top:18px;bottom:18px;width:3px;background:white}.circle{left:50%;top:50%;width:110px;height:110px;border:3px solid white;border-radius:50%;transform:translate(-50%,-50%)}.box{border:3px solid white}.box.left{left:18px;top:50%;width:110px;height:190px;transform:translateY(-50%);border-left:0}.box.right{right:18px;top:50%;width:110px;height:190px;transform:translateY(-50%);border-right:0}.half .field{left:8%;right:8%;top:18px;bottom:18px}.half .mid,.half .circle,.half .box.left{display:none}.half .box.right{right:8%;height:220px;width:130px}.futsal .circle{width:80px;height:80px}.futsal .box{height:140px;width:80px}.blank .field,.blank .mid,.blank .circle,.blank .box{display:none}.item{position:absolute;transform:translate(-50%,-50%) scale(.72);transform-origin:center;cursor:grab;user-select:none;touch-action:none;font-size:32px;line-height:1;transition:outline .15s}.item.selected{outline:3px solid #ffd166;outline-offset:7px;border-radius:10px}.player{width:34px;height:34px;border-radius:50%;background:white;color:#0b5b3d;display:grid;place-items:center;font-size:12px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.small{background:var(--g);color:white;border:0}.secondary{background:#e6f7ef;color:#087454}.dangerBtn{background:#fff0ef;color:#9b2c24}@media(max-width:520px){.app{padding:10px}.card{padding:14px}.tools{grid-template-columns:repeat(2,1fr)}.editor{height:72vh;min-height:480px;border-radius:16px}.item{transform:translate(-50%,-50%) scale(.64)}.player{width:32px;height:32px;font-size:11px}.circle{width:82px;height:82px}.box.left,.box.right{width:78px;height:145px}.half .box.right{width:95px;height:175px}}</style></head><body><main class="app"><div class="head">⚽ CoachFlow <button class="small secondary" onclick="backToExercise()">← Exercice</button></div><section class="card hero"><h1>Éditeur visuel</h1><p>Choisis ton terrain, ajoute des éléments, déplace-les et fais-les pivoter.</p></section><section class="card"><div class="label">TYPE DE TERRAIN</div><div class="terrainChoice"><button class="sel" onclick="setTerrain('full',this)">🏟️ Terrain complet</button><button onclick="setTerrain('half',this)">🥅 Demi-terrain</button><button onclick="setTerrain('futsal',this)">⚽ Futsal</button><button onclick="setTerrain('blank',this)">⬜ Libre</button></div><div class="tools"><button class="tool" onclick="add('player')">👤 Joueur</button><button class="tool" onclick="add('ball')">⚽ Ballon</button><button class="tool" onclick="add('cone')">🔺 Cône</button><button class="tool" onclick="add('goal')">🥅 But</button><button class="tool" onclick="add('arrow')">➜ Flèche</button><button class="tool danger" onclick="clearField()">🗑️ Vider</button></div><div class="editor full" id="editor"><div class="field"></div><div class="mid"></div><div class="circle"></div><div class="box left"></div><div class="box right"></div></div><div class="actions"><button class="small" onclick="rotateSelected(-45)">↺ -45°</button><button class="small" onclick="rotateSelected(45)">↻ +45°</button><button class="small dangerBtn" onclick="deleteSelected()">🗑️ Supprimer</button><button class="small secondary" onclick="saveDiagram()">💾 Utiliser ce schéma</button></div></section></main><script>const editor=document.getElementById('editor');let selected=null,playerNumber=1,terrain='full';const symbols={ball:'⚽',cone:'🔺',goal:'🥅',arrow:'➜'};function setTerrain(t,b){terrain=t;editor.className='editor '+t;document.querySelectorAll('.terrainChoice button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}function add(type){const el=document.createElement('div');el.className='item';el.dataset.type=type;el.dataset.rotation='0';el.style.left='50%';el.style.top='50%';if(type==='player'){el.classList.add('player');el.textContent=playerNumber++}else el.textContent=symbols[type];el.addEventListener('pointerdown',startDrag);el.addEventListener('click',()=>select(el));editor.appendChild(el);select(el)}function select(el){document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));selected=el;if(el)el.classList.add('selected')}function startDrag(e){e.stopPropagation();select(e.currentTarget);const el=selected;el.setPointerCapture?.(e.pointerId);let moved=false,startX=e.clientX,startY=e.clientY;const move=x=>{if(Math.abs(x.clientX-startX)>4||Math.abs(x.clientY-startY)>4)moved=true;if(!moved)return;x.preventDefault();const r=editor.getBoundingClientRect();el.style.left=Math.max(4,Math.min(96,(x.clientX-r.left)/r.width*100))+'%';el.style.top=Math.max(5,Math.min(95,(x.clientY-r.top)/r.height*100))+'%'};const stop=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop);window.removeEventListener('pointercancel',stop)};window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',stop);window.addEventListener('pointercancel',stop)}function rotateSelected(delta){if(!selected)return;let r=(Number(selected.dataset.rotation)||0)+delta;selected.dataset.rotation=r;selected.style.transform='translate(-50%,-50%) scale(.72) rotate('+r+'deg)'}function deleteSelected(){if(selected){selected.remove();selected=null}}function clearField(){editor.querySelectorAll('.item').forEach(x=>x.remove());selected=null;playerNumber=1}function saveDiagram(){const items=[...editor.querySelectorAll('.item')].map(x=>({type:x.dataset.type,label:x.dataset.type==='player'?x.textContent:null,x:x.style.left,y:x.style.top,rotation:Number(x.dataset.rotation)||0}));localStorage.setItem('coachflowDiagram',JSON.stringify({terrain,items,savedAt:Date.now()}));location.href='/create-exercise.html?diagram=saved'}function backToExercise(){location.href='/create-exercise.html'}document.addEventListener('keydown',e=>{if(e.key==='Delete')deleteSelected();if(e.key==='Escape')select(null)});editor.addEventListener('click',()=>select(null))</script></body></html>
