<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Éditeur visuel CoachFlow</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#0b1f18}.app{max-width:700px;margin:auto;padding:18px}.head{font-size:24px;font-weight:900}.hero,.card{background:#fff;border-radius:24px;padding:20px;margin-top:14px}.hero{background:#09271f;color:white}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.tool,.small{border:0;border-radius:14px;padding:12px;font-weight:800}.tool{background:#e6f7ef}.danger{background:#fff0ef;color:#9b2c24}.editor{height:390px;background:#16805a;border-radius:20px;position:relative;overflow:hidden}.field{position:absolute;inset:18px;border:3px solid white;border-radius:12px;pointer-events:none}.mid{position:absolute;left:50%;top:18px;bottom:18px;width:2px;background:white;pointer-events:none}.item{position:absolute;transform:translate(-50%,-50%);cursor:grab;user-select:none;touch-action:none;font-size:30px}.player{width:40px;height:40px;border-radius:50%;background:white;color:#0b5b3d;display:grid;place-items:center;font-size:13px;font-weight:900}.small{background:#0f8f68;color:white;margin:10px 6px 0 0}</style></head><body><main class="app"><div class="head">⚽ CoachFlow</div><section class="hero"><h1>Éditeur visuel</h1><p>Ajoute les éléments puis déplace-les sur le terrain.</p></section><section class="card"><div class="tools"><button class="tool" onclick="add('👤')">👤 Joueur</button><button class="tool" onclick="add('⚽')">⚽ Ballon</button><button class="tool" onclick="add('🔺')">🔺 Cône</button><button class="tool" onclick="add('🥅')">🥅 But</button><button class="tool" onclick="add('➜')">➜ Flèche</button><button class="tool danger" onclick="clearField()">🗑️ Vider</button></div><div class="editor" id="editor"><div class="field"></div><div class="mid"></div></div><button class="small" onclick="deleteSelected()">Supprimer la sélection</button><button class="small" onclick="location.href='/create-exercise.html'">Retour à l'exercice</button></section></main><script>const editor=document.getElementById('editor');let selected=null;let playerNumber=1;function add(symbol){const el=document.createElement('div');el.className='item';el.style.left='50%';el.style.top='50%';if(symbol==='👤'){el.classList.add('player');el.textContent=playerNumber++}else{el.textContent=symbol}el.addEventListener('pointerdown',startDrag);editor.appendChild(el);selected=el}function startDrag(e){selected=e.currentTarget;const el=selected;const move=x=>{const r=editor.getBoundingClientRect();el.style.left=Math.max(6,Math.min(94,(x.clientX-r.left)/r.width*100))+'%';el.style.top=Math.max(7,Math.min(93,(x.clientY-r.top)/r.height*100))+'%'};const stop=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',stop)}function deleteSelected(){if(selected){selected.remove();selected=null}}function clearField(){editor.querySelectorAll('.item').forEach(x=>x.remove());selected=null}</script></body></html>
